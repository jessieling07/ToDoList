<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clariq – Library</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Quill Rich Text Editor -->
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <button class="icon-btn" id="toggleSidebar">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <span class="brand">✦ Clariq</span>
        </div>
        <nav class="sidebar-nav">
          <a href="tasks.html" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span>Home</span>
          </a>
          <a href="calendar.html" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span>Calendar</span>
          </a>
          <a href="library.html" class="nav-item active">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
              />
            </svg>
            <span>Library</span>
          </a>
          <div class="nav-label">Recents</div>
          <div id="sidebarRecents">
            <a class="nav-item recent">No recent pages</a>
          </div>
        </nav>
        <div class="sidebar-bottom">
          <a href="#" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.07 4.93A10 10 0 1 0 4.93 19.07 10 10 0 0 0 19.07 4.93z"
              />
            </svg>
            <span>Settings</span>
          </a>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main">
        <div class="topbar">
          <button class="icon-btn" id="toggleSidebarMain">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
        </div>

        <div class="content">
          <div class="page-title">Library</div>

          <!-- TABS -->
          <div class="tabs">
            <button class="tab active" data-tab="notes">Notes</button>
            <button class="tab" data-tab="files">Files</button>
          </div>

          <!-- NOTES TAB -->
          <div class="tab-content active" id="notesTab">
            <button class="action-btn" id="addNoteBtn">+ New Note</button>
            <div class="grid" id="notesGrid">
              <div class="empty-state">No notes yet</div>
            </div>
          </div>

          <!-- FILES TAB -->
          <div class="tab-content" id="filesTab">
            <label class="action-btn upload-label">
              + Upload File
              <input type="file" id="fileInput" hidden />
            </label>
            <div class="grid" id="filesGrid">
              <div class="empty-state">No files yet</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- NOTE MODAL -->
    <div class="modal-overlay" id="noteModal">
      <div class="modal wide">
        <h3 id="noteModalTitle">New Note</h3>
        <input type="text" id="noteTitleInput" placeholder="Note title" />
        <!-- Quill Editor -->
        <div
          id="noteEditor"
          style="height: 300px; background: white; border-radius: 8px"
        ></div>
        <div class="modal-btns">
          <button class="modal-cancel" id="cancelNote">Cancel</button>
          <button class="modal-save" id="saveNote">Save</button>
        </div>
      </div>
    </div>

    <!-- VIEW NOTE MODAL -->
    <div class="modal-overlay" id="viewNoteModal">
      <div class="modal wide">
        <h3 id="viewNoteTitle"></h3>
        <div
          id="viewNoteContent"
          style="
            padding: 16px;
            background: white;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
          "
        ></div>
        <div class="modal-btns">
          <button class="modal-save" id="closeViewNote">Close</button>
        </div>
      </div>
    </div>

    <!-- Quill Library -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script>
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "login.html";

      // Track visit
      function trackVisit(name, url, icon) {
        let recents = JSON.parse(
          localStorage.getItem("clariq_recents") || "[]",
        );
        recents = recents.filter((r) => r.url !== url);
        recents.unshift({ name, url, icon, time: Date.now() });
        recents = recents.slice(0, 6);
        localStorage.setItem("clariq_recents", JSON.stringify(recents));
      }
      trackVisit("Library", "library.html", "library");

      // Sidebar recents
      function renderSidebarRecents() {
        const recents = JSON.parse(
          localStorage.getItem("clariq_recents") || "[]",
        );
        const el = document.getElementById("sidebarRecents");
        if (recents.length === 0) {
          el.innerHTML = '<a class="nav-item recent">No recent pages</a>';
          return;
        }
        el.innerHTML = recents
          .map(
            (r) =>
              `<a href="${r.url}" class="nav-item recent-link">${r.name}</a>`,
          )
          .join("");
      }
      renderSidebarRecents();

      // Sidebar toggle
      function toggleSidebar() {
        document.getElementById("app").classList.toggle("sidebar-collapsed");
      }
      document
        .getElementById("toggleSidebar")
        .addEventListener("click", toggleSidebar);
      document
        .getElementById("toggleSidebarMain")
        .addEventListener("click", toggleSidebar);

      // Tabs
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.remove("active"));
          document
            .querySelectorAll(".tab-content")
            .forEach((c) => c.classList.remove("active"));
          tab.classList.add("active");
          document
            .getElementById(tab.dataset.tab + "Tab")
            .classList.add("active");
        });
      });

      // Modals
      function openModal(id) {
        document.getElementById(id).classList.add("show");
      }
      function closeModal(id) {
        document.getElementById(id).classList.remove("show");
      }

      // ===== QUILL EDITOR SETUP =====
      let quill;
      function initializeQuill() {
        if (!quill) {
          quill = new Quill("#noteEditor", {
            theme: "snow",
            placeholder: "Write your note here...",
            modules: {
              toolbar: [
                ["bold", "italic", "underline", "strike"],
                ["blockquote", "code-block"],
                [{ header: 1 }, { header: 2 }],
                [{ list: "ordered" }, { list: "bullet" }],
                [{ color: [] }, { background: [] }],
                ["link", "image"],
                ["clean"],
              ],
            },
          });
        }
      }

      // NOTES
      async function loadNotes() {
        try {
          const res = await fetch("http://localhost:3000/notes", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const notes = await res.json();
          const grid = document.getElementById("notesGrid");
          if (notes.length === 0) {
            grid.innerHTML = '<div class="empty-state">No notes yet</div>';
            return;
          }
          grid.innerHTML = notes
            .map(
              (n) => `
          <div class="card" onclick="viewNote(${n.id}, '${encodeURIComponent(n.title)}', '${encodeURIComponent(n.content || "")}')">
            <div class="card-icon">📝</div>
            <div class="card-info">
              <div class="card-title">${n.title}</div>
              <div class="card-sub">${(n.content || "").substring(0, 60)}${(n.content || "").length > 60 ? "..." : ""}</div>
            </div>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteNote(${n.id})">✕</button>
          </div>
        `,
            )
            .join("");
        } catch (err) {
          console.error(err);
        }
      }

      function viewNote(id, title, content) {
        document.getElementById("viewNoteTitle").textContent =
          decodeURIComponent(title);
        document.getElementById("viewNoteContent").innerHTML =
          decodeURIComponent(content);
        openModal("viewNoteModal");
      }

      document
        .getElementById("closeViewNote")
        .addEventListener("click", () => closeModal("viewNoteModal"));

      document.getElementById("addNoteBtn").addEventListener("click", () => {
        document.getElementById("noteTitleInput").value = "";
        initializeQuill();
        quill.setContents([]); // Clear editor
        openModal("noteModal");
      });

      document
        .getElementById("cancelNote")
        .addEventListener("click", () => closeModal("noteModal"));
      document
        .getElementById("saveNote")
        .addEventListener("click", async () => {
          const title = document.getElementById("noteTitleInput").value.trim();
          const content = quill.root.innerHTML;
          if (!title) {
            alert("Please enter a note title");
            return;
          }
          await fetch("http://localhost:3000/notes", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ title, content }),
          });
          closeModal("noteModal");
          loadNotes();
        });

      async function deleteNote(id) {
        await fetch(`http://localhost:3000/notes/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        loadNotes();
      }

      // FILES
      async function loadFiles() {
        try {
          const res = await fetch("http://localhost:3000/files", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const files = await res.json();
          const grid = document.getElementById("filesGrid");
          if (files.length === 0) {
            grid.innerHTML = '<div class="empty-state">No files yet</div>';
            return;
          }
          grid.innerHTML = files
            .map(
              (f) => `
          <div class="card">
            <div class="card-icon">${getFileIcon(f.originalname)}</div>
            <div class="card-info">
              <div class="card-title">${f.originalname}</div>
              <a class="card-sub link" href="http://localhost:3000/uploads/${f.filename}" target="_blank">Open file</a>
            </div>
            <button class="delete-btn" onclick="deleteFile(${f.id})">✕</button>
          </div>
        `,
            )
            .join("");
        } catch (err) {
          console.error(err);
        }
      }

      function getFileIcon(name) {
        const ext = name.split(".").pop().toLowerCase();
        if (["jpg", "jpeg", "png", "gif", "webp"].includes(ext)) return "🖼️";
        if (["pdf"].includes(ext)) return "📄";
        if (["doc", "docx"].includes(ext)) return "📝";
        if (["xls", "xlsx"].includes(ext)) return "📊";
        if (["mp4", "mov", "avi"].includes(ext)) return "🎬";
        if (["mp3", "wav"].includes(ext)) return "🎵";
        if (["zip", "rar"].includes(ext)) return "🗜️";
        return "📁";
      }

      document
        .getElementById("fileInput")
        .addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const formData = new FormData();
          formData.append("file", file);
          await fetch("http://localhost:3000/files", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData,
          });
          e.target.value = "";
          loadFiles();
        });

      async function deleteFile(id) {
        await fetch(`http://localhost:3000/files/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        loadFiles();
      }

      loadNotes();
      loadFiles();
    </script>
  </body>
</html>
