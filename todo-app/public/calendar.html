<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clariq – Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <div class="app" id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" id="toggleSidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="brand">✦ Clariq</span>
      </div>
      <nav class="sidebar-nav">
        <a href="tasks.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
        </a>
        <a href="calendar.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Calendar</span>
        </a>
        <a href="library.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>Library</span>
        </a>
        <div class="nav-label">Recents</div>
        <div id="sidebarRecents"><a class="nav-item recent">No recent pages</a></div>
      </nav>
      <div class="sidebar-bottom">
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1 0 4.93 19.07 10 10 0 0 0 19.07 4.93z"/></svg>
          <span>Settings</span>
        </a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="topbar">
        <button class="icon-btn" id="toggleSidebarMain">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-center">
          <button class="cal-nav" id="prevMonth">&#8249;</button>
          <span class="cal-title" id="calTitle"></span>
          <button class="cal-nav" id="nextMonth">&#8250;</button>
        </div>
        <button class="add-event-btn" id="addEventBtn">+ Add event</button>
      </div>

      <div class="content">
        <div class="cal-days-header">
          <span>Sunday</span><span>Monday</span><span>Tuesday</span><span>Wednesday</span><span>Thursday</span><span>Friday</span><span>Saturday</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </main>
  </div>

  <!-- ADD EVENT MODAL -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal">
      <h3>Add Event</h3>
      <input type="text" id="eventTitle" placeholder="Event title" />
      <input type="date" id="eventDate" />
      <div class="modal-btns">
        <button class="modal-cancel" id="cancelEvent">Cancel</button>
        <button class="modal-save" id="saveEvent">Save</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    // Track visit
    function trackVisit(name, url, icon) {
      let recents = JSON.parse(localStorage.getItem('clariq_recents') || '[]');
      recents = recents.filter(r => r.url !== url);
      recents.unshift({ name, url, icon, time: Date.now() });
      recents = recents.slice(0, 6);
      localStorage.setItem('clariq_recents', JSON.stringify(recents));
    }
    trackVisit('Calendar', 'calendar.html', 'calendar');

    // Sidebar recents
    function renderSidebarRecents() {
      const recents = JSON.parse(localStorage.getItem('clariq_recents') || '[]');
      const el = document.getElementById('sidebarRecents');
      if (recents.length === 0) { el.innerHTML = '<a class="nav-item recent">No recent pages</a>'; return; }
      el.innerHTML = recents.map(r => `<a href="${r.url}" class="nav-item recent-link">${r.name}</a>`).join('');
    }
    renderSidebarRecents();

    // Sidebar toggle
    function toggleSidebar() { document.getElementById('app').classList.toggle('sidebar-collapsed'); }
    document.getElementById('toggleSidebar').addEventListener('click', toggleSidebar);
    document.getElementById('toggleSidebarMain').addEventListener('click', toggleSidebar);

    // Calendar
    let currentDate = new Date();
    let events = [];

    async function fetchEvents() {
      try {
        const res = await fetch('/events', { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        // Normalize date strings (DB returns full date, keep only YYYY-MM-DD)
        events = data.map(e => ({ ...e, date: e.date.slice(0, 10) }));
        renderCalendar();
      } catch (err) {
        console.error('Failed to load events:', err);
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('calTitle').textContent = `${monthNames[month]} ${year}`;
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-cell empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayEvents = events.filter(e => e.date === dateStr);
        const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        if (isToday) cell.classList.add('today');

        cell.innerHTML = `
          <div class="cell-day ${isToday ? 'today-num' : ''}">${d}</div>
          <div class="cell-events">
            ${dayEvents.map(e => `
              <div class="cell-event" onclick="event.stopPropagation(); deleteEvent(${e.id})">
                ${e.title}
              </div>
            `).join('')}
          </div>
        `;

        cell.addEventListener('click', () => {
          document.getElementById('eventDate').value = dateStr;
          openModal('eventModal');
        });

        grid.appendChild(cell);
      }
    }

    async function deleteEvent(id) {
      try {
        await fetch(`/events/${id}`, {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + token }
        });
        await fetchEvents();
      } catch (err) {
        console.error('Failed to delete event:', err);
      }
    }

    document.getElementById('prevMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('nextMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    document.getElementById('addEventBtn').addEventListener('click', () => openModal('eventModal'));
    document.getElementById('cancelEvent').addEventListener('click', () => closeModal('eventModal'));
    document.getElementById('saveEvent').addEventListener('click', async () => {
      const title = document.getElementById('eventTitle').value.trim();
      const date = document.getElementById('eventDate').value;
      if (!title || !date) return;
      try {
        await fetch('/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ title, date })
        });
        document.getElementById('eventTitle').value = '';
        document.getElementById('eventDate').value = '';
        closeModal('eventModal');
        await fetchEvents();
      } catch (err) {
        console.error('Failed to save event:', err);
      }
    });

    fetchEvents();
  </script>
</body>
</html>
