<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clariq – Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tasks.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <button class="icon-btn" id="toggleSidebar" title="Toggle sidebar">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <span class="brand">✦ Clariq</span>
        </div>

        <nav class="sidebar-nav">
          <a href="tasks.html" class="nav-item active">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span>Home</span>
          </a>
          <a href="calendar.html" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span>Calendar</span>
          </a>
          <a href="library.html" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
              />
            </svg>
            <span>Library</span>
          </a>
          <div class="nav-label">Recents</div>
          <div id="sidebarRecents">
            <a class="nav-item recent">No recent pages</a>
          </div>
        </nav>

        <div class="sidebar-bottom">
          <a href="#" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.07 4.93A10 10 0 1 0 4.93 19.07 10 10 0 0 0 19.07 4.93z"
              />
            </svg>
            <span>Settings</span>
          </a>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main" id="main">
        <div class="topbar">
          <button class="icon-btn" id="toggleSidebarMain">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="topbar-right">
            <div class="more-menu-wrap">
              <button class="icon-btn" id="moreBtn">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="5" cy="12" r="1" />
                  <circle cx="12" cy="12" r="1" />
                  <circle cx="19" cy="12" r="1" />
                </svg>
              </button>
              <div class="more-dropdown" id="moreDropdown">
                <div class="more-item">Coming soon...</div>
              </div>
            </div>
          </div>
        </div>

        <div class="content">
          <div class="greeting" id="greeting">Good morning, User!</div>

          <!-- RECENTLY VISITED -->
          <div class="section-label">Recently Visited</div>
          <div class="recents-row" id="recentsRow">
            <div class="recent-empty">Nothing visited yet</div>
          </div>

          <div class="panels">
            <!-- UPCOMING EVENTS PANEL -->
            <div class="panel upcoming-events-panel">
              <div class="panel-header">
                <span>Upcoming Events</span>
                <button class="add-event-btn" id="addEventBtn">
                  + Add event
                </button>
              </div>
              <div class="upcoming-events-list" id="upcomingEventsList"></div>
            </div>

            <!-- TODO PANEL -->
            <div class="panel todo-panel">
              <div class="panel-header"><span>To do</span></div>
              <ul class="task-list" id="taskList"></ul>
              <button class="add-task-btn" id="addTaskBtn">+ Add task</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ADD EVENT MODAL -->
    <div class="modal-overlay" id="eventModal">
      <div class="modal">
        <h3>Add Event</h3>
        <input type="text" id="eventTitle" placeholder="Event title" />
        <input type="date" id="eventDate" />
        <input type="time" id="eventTime" />

        <!-- Tag Selector from Custom Tags -->
        <div class="tag-selector">
          <label
            style="
              font-size: 11px;
              font-weight: 500;
              color: var(--placeholder-bg);
              text-transform: uppercase;
              letter-spacing: 0.05em;
              display: block;
              margin-bottom: 8px;
            "
            >Tag</label
          >
          <select
            id="eventTagSelect"
            style="
              width: 100%;
              padding: 12px 16px;
              border: 1.5px solid var(--input-border);
              border-radius: 50px;
              font-family: &quot;DM Sans&quot;, sans-serif;
              font-size: 14px;
              color: var(--text);
              outline: none;
              background: var(--bg);
            "
          >
            <option value="">Choose a tag...</option>
          </select>
        </div>

        <div class="modal-btns">
          <button class="modal-cancel" id="cancelEvent">Cancel</button>
          <button class="modal-save" id="saveEvent">Save</button>
        </div>
      </div>
    </div>

    <!-- ADD TASK MODAL -->
    <div class="modal-overlay" id="taskModal">
      <div class="modal">
        <h3>Add Task</h3>
        <input type="text" id="newTaskTitle" placeholder="Task title" />
        <div class="modal-btns">
          <button class="modal-cancel" id="cancelTask">Cancel</button>
          <button class="modal-save" id="saveTask">Save</button>
        </div>
      </div>
    </div>

    <script>
      // ===== TAG COLOR PALETTE =====
      const AVAILABLE_TAG_COLORS = [
        "#3D5E66",
        "#D02F43",
        "#2A1664",
        "#8EAB8C",
        "#D37E93",
        "#6882D4",
        "#C84FE3",
      ];

      // ===== TAG MANAGEMENT FUNCTIONS =====
      function getAllTags() {
        return JSON.parse(localStorage.getItem("clariq_tags") || "[]");
      }

      function saveTags(tags) {
        localStorage.setItem("clariq_tags", JSON.stringify(tags));
      }

      function getTagById(id) {
        return getAllTags().find((t) => t.id === id);
      }

      function createTag(name, color) {
        const tags = getAllTags();
        const newId =
          tags.length > 0 ? Math.max(...tags.map((t) => t.id)) + 1 : 1;
        const newTag = { id: newId, name, color };
        tags.push(newTag);
        saveTags(tags);
        return newTag;
      }

      function deleteTag(id) {
        const tags = getAllTags().filter((t) => t.id !== id);
        saveTags(tags);
        let events = JSON.parse(localStorage.getItem("clariq_events") || "[]");
        events = events.map((e) =>
          e.tagId === id ? { ...e, tagId: tags[0]?.id || null } : e,
        );
        localStorage.setItem("clariq_events", JSON.stringify(events));
      }

      function ensureDefaultTags() {
        const tags = getAllTags();
        if (tags.length === 0) {
          createTag("Tasks", "#3D5E66");
        }
      }

      // ===== EVENT MIGRATION =====
      function migrateOldEvents() {
        ensureDefaultTags();
        let events = JSON.parse(localStorage.getItem("clariq_events") || "[]");
        const tags = getAllTags();

        const needsMigration = events.some(
          (e) => e.tagId === undefined && e.tag,
        );
        if (needsMigration) {
          events = events.map((e) => {
            if (e.tagId === undefined) {
              return {
                title: e.title,
                date: e.date,
                time: e.time || "09:00",
                tagId: tags[0]?.id || 1,
              };
            }
            return e;
          });
          localStorage.setItem("clariq_events", JSON.stringify(events));
        }
      }

      // ===== BACKWARDS COMPATIBILITY FOR OLD EVENTS =====
      function convertEventToNew(oldEvent) {
        if (oldEvent.tagId === undefined) {
          ensureDefaultTags();
          const tags = getAllTags();
          return { ...oldEvent, time: "09:00", tagId: tags[0]?.id || 1 };
        }
        return oldEvent;
      }

      function getAllEventsConverted() {
        return JSON.parse(localStorage.getItem("clariq_events") || "[]").map(
          convertEventToNew,
        );
      }

      const token = localStorage.getItem("token");
      if (!token) window.location.href = "login.html";

      // Initialize tags on page load
      ensureDefaultTags();
      migrateOldEvents();

      // ===== TAG SELECTOR FOR EVENTS =====
      function populateTagSelector() {
        const tags = getAllTags();
        const selector = document.getElementById("eventTagSelect");
        if (!selector) return;

        selector.innerHTML =
          '<option value="">Choose a tag...</option>' +
          tags
            .map((tag) => `<option value="${tag.id}">${tag.name}</option>`)
            .join("");
      }

      populateTagSelector();

      function trackVisit(name, url, icon) {
        let recents = JSON.parse(
          localStorage.getItem("clariq_recents") || "[]",
        );
        recents = recents.filter((r) => r.url !== url);
        recents.unshift({ name, url, icon, time: Date.now() });
        recents = recents.slice(0, 6);
        localStorage.setItem("clariq_recents", JSON.stringify(recents));
      }
      trackVisit("Home", "tasks.html", "home");

      function getIcon(type) {
        const icons = {
          home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
          calendar:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
          library:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
        };
        return icons[type] || icons.home;
      }

      function renderRecents() {
        const recents = JSON.parse(
          localStorage.getItem("clariq_recents") || "[]",
        );
        const row = document.getElementById("recentsRow");
        const sidebarRecents = document.getElementById("sidebarRecents");
        if (recents.length === 0) {
          row.innerHTML = '<div class="recent-empty">Nothing visited yet</div>';
          sidebarRecents.innerHTML =
            '<a class="nav-item recent">No recent pages</a>';
          return;
        }
        row.innerHTML = recents
          .map(
            (r) => `
        <a href="${r.url}" class="recent-card">
          <div class="recent-icon">${getIcon(r.icon)}</div>
          <span>${r.name}</span>
        </a>
      `,
          )
          .join("");
        sidebarRecents.innerHTML = recents
          .map(
            (r) => `
        <a href="${r.url}" class="nav-item recent-link">${r.name}</a>
      `,
          )
          .join("");
      }

      function setGreeting() {
        const h = new Date().getHours();
        const part = h < 12 ? "morning" : h < 17 ? "afternoon" : "evening";
        try {
          const payload = JSON.parse(atob(token.split(".")[1]));
          const name =
            payload.username || payload.email?.split("@")[0] || "User";
          document.getElementById("greeting").textContent =
            `Good ${part}, ${name}!`;
        } catch {
          document.getElementById("greeting").textContent =
            `Good ${part}, User!`;
        }
      }
      setGreeting();

      function toggleSidebar() {
        document.getElementById("app").classList.toggle("sidebar-collapsed");
      }
      document
        .getElementById("toggleSidebar")
        .addEventListener("click", toggleSidebar);
      document
        .getElementById("toggleSidebarMain")
        .addEventListener("click", toggleSidebar);

      document
        .getElementById("moreBtn")
        .addEventListener("click", () =>
          document.getElementById("moreDropdown").classList.toggle("show"),
        );
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".more-menu-wrap"))
          document.getElementById("moreDropdown").classList.remove("show");
      });

      let currentDate = new Date();
      let events = JSON.parse(localStorage.getItem("clariq_events") || "[]");
      function saveEvents() {
        localStorage.setItem("clariq_events", JSON.stringify(events));
      }

      function renderUpcomingEvents() {
        const allEvents = getAllEventsConverted();
        const now = new Date();
        now.setHours(0, 0, 0, 0);

        const upcomingEvents = allEvents
          .filter((e) => {
            const eventDateTime = new Date(e.date + "T" + (e.time || "09:00"));
            return eventDateTime >= now;
          })
          .sort((a, b) => {
            const dateA = new Date(a.date + "T" + (a.time || "09:00"));
            const dateB = new Date(b.date + "T" + (b.time || "09:00"));
            return dateA - dateB;
          })
          .slice(0, 10);

        const list = document.getElementById("upcomingEventsList");

        if (upcomingEvents.length === 0) {
          list.innerHTML = '<p class="no-events">No upcoming events</p>';
          return;
        }

        list.innerHTML = upcomingEvents
          .map((e) => {
            const eventDate = new Date(e.date);
            const dateStr = eventDate.toLocaleDateString("en-US", {
              month: "short",
              day: "numeric",
            });
            const tag = getTagById(e.tagId);
            const tagColor = tag?.color || "#999";

            return `
          <div class="upcoming-event-item">
            <div class="event-color-dot" style="background: ${tagColor}"></div>
            <div class="upcoming-event-content">
              <div class="upcoming-event-title">${e.title}</div>
              <div class="upcoming-event-meta">${dateStr} at ${e.time || "09:00"}</div>
            </div>
          </div>
        `;
          })
          .join("");
      }

      function openModal(id) {
        document.getElementById(id).classList.add("show");
      }
      function closeModal(id) {
        document.getElementById(id).classList.remove("show");
      }

      document
        .getElementById("addEventBtn")
        .addEventListener("click", () => openModal("eventModal"));
      document
        .getElementById("cancelEvent")
        .addEventListener("click", () => closeModal("eventModal"));
      document.getElementById("saveEvent").addEventListener("click", () => {
        const title = document.getElementById("eventTitle").value.trim();
        const date = document.getElementById("eventDate").value;
        const time = document.getElementById("eventTime").value || "09:00";
        const tagId = parseInt(document.getElementById("eventTagSelect").value);

        if (!title || !date || !tagId) {
          alert("Please fill in all fields");
          return;
        }

        events.push({
          title,
          date,
          time,
          tagId,
        });
        saveEvents();
        renderUpcomingEvents();

        document.getElementById("eventTitle").value = "";
        document.getElementById("eventDate").value = "";
        document.getElementById("eventTime").value = "";
        document.getElementById("eventTagSelect").value = "";
        closeModal("eventModal");
      });

      document
        .getElementById("addTaskBtn")
        .addEventListener("click", () => openModal("taskModal"));
      document
        .getElementById("cancelTask")
        .addEventListener("click", () => closeModal("taskModal"));
      document.getElementById("saveTask").addEventListener("click", addTask);
      document
        .getElementById("newTaskTitle")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") addTask();
        });

      async function loadTasks() {
        try {
          const res = await fetch("http://localhost:3000/tasks", {
            headers: { Authorization: `Bearer ${token}` },
          });
          renderTasks(await res.json());
        } catch (err) {
          console.error("Failed to load tasks", err);
        }
      }

      function renderTasks(tasks) {
        const list = document.getElementById("taskList");
        if (tasks.length === 0) {
          list.innerHTML = '<li class="no-tasks">No tasks yet</li>';
          return;
        }
        list.innerHTML = tasks
          .map(
            (t) => `
        <li class="task-item ${t.completed ? "done" : ""}">
          <input type="checkbox" ${t.completed ? "checked" : ""} onchange="updateTask(${t.id}, this.checked)" />
          <span class="task-title">${t.title}</span>
          <button class="delete-btn" onclick="deleteTask(${t.id})">✕</button>
        </li>
      `,
          )
          .join("");
      }

      async function addTask() {
        const title = document.getElementById("newTaskTitle").value.trim();
        if (!title) return;
        await fetch("http://localhost:3000/tasks", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ title }),
        });
        document.getElementById("newTaskTitle").value = "";
        closeModal("taskModal");
        loadTasks();
      }

      async function updateTask(id, completed) {
        await fetch(`http://localhost:3000/tasks/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ completed }),
        });
        loadTasks();
      }

      async function deleteTask(id) {
        await fetch(`http://localhost:3000/tasks/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        loadTasks();
      }

      renderUpcomingEvents();
      loadTasks();
      renderRecents();
    </script>
  </body>
</html>
